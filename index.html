
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 영화 보드</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top">
    <h1>내 영화 보드</h1>

    <nav>
      <ul>
        <li><a href="#board">보드</a></li>
        <li><a href="#about">소개</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h2>요즘 내가 고른 영화 여섯 편</h2>
    <p>내가 좋아하는 영화들을 소개합니다.</p>
  </section>

  <main>

    <div class="toolbar">
      <p id="count"></p>

      <label for="sort">정렬</label>

      <select id="sort" onchange="applySort()">
        <option value="rating">평점순</option>
        <option value="year">최신 개봉순</option>
        <option value="title">제목순</option>
      </select>
    </div>

    <!-- 영화 카드는 JavaScript가 생성 -->
    <section class="board" id="board">
    </section>

    <section id="about">
      <h2>이 보드에 대하여</h2>
      <p>
        제가 좋아하는 영화 여섯 편을 소개하는 영화 보드입니다.
      </p>
      <p>
        영화 정보와 포스터를 확인하고 평점과 개봉 연도에 따라
        정렬할 수 있습니다.
      </p>
    </section>

  </main>

  <footer>
    <p>
      이 사이트는 TMDB API를 사용하지만 TMDB의 보증이나 인증을 받지 않았습니다.
    </p>

    <p>
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </p>

    <p>
      영화 정보 및 포스터 이미지 출처: TMDB
    </p>
  </footer>

  <!-- data.js가 반드시 먼저 실행되어야 함 -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
